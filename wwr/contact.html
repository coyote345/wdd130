<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Riverbend Rafting Co.</title>
    <meta name="description" content="Contact Riverbend Rafting Co. to book your rafting adventure, ask questions, or plan your trip. Reach out today — we're happy to help.">
    <meta name="author" content="Fernando Munoz">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>


    <header>
        <img src="images/logo.jpg" alt="rafting-logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>   

    <main>
        <form action="box">
        <section id="contact-info">

            <div class="company-details">
                <h1>Riverbend Rafting Co.</h1>
                <ul class="contact-list">
                    <li>1234 River Run Road<br>Grand Junction, CO 81501</li>
                    <li><a href="tel:+15755550142">(575) 555-0142</a></li>
                    <li><a href="tel:+15755550198">(575) 555-0198</a></li>
                    <li><a href="mailto:contact_us@riverbend-rafting.com">contact_us@riverbend-rafting.com</a></li>
                </ul>
            </div>

            <div class="map-and-form">

                <div class="map-container">
                    <iframe
                        src="https://maps.app.goo.gl/8fA4PkZZHG5aU3jVA"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        title="Riverbend Rafting Co. location map">
                    </iframe>
                </div>

                <div class="form-wrapper">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <fieldset class="form-group">
                        <legend>Message Purpose</legend>
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type here..." required></textarea>
                    </div>

                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter" value="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit" class="submit-btn">Get in Touch!</button>

                </div>

            </div>

        </section>

        <section id="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">

                <figure>
                    <img src="images/rafting_head_guide.jpg" alt="Sofia Martinez, Head Guide">
                    <figcaption>Sofia Martinez<br><span>Head Guide</span></figcaption>
                </figure>

                <figure>
                    <img src="images/rafting_safety_officer.jpg" alt="Jake Miller, Safety Officer">
                    <figcaption>Jake Miller<br><span>Safety Officer</span></figcaption>
                </figure>

                <figure>
                    <img src="images/reservations_manager.jpg" alt="Anya Sharma, Reservations Manager">
                    <figcaption>Anya Sharma<br><span>Reservations Manager</span></figcaption>
                </figure>

            </div>
        </section>
        </form>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>©️2026 | Riverbend Rafting Co. | Fernando Munoz</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.png" alt="facebook_icon"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.png" alt="instagram_icon"></a>
            <a href="https://www.youtube.com/"><img src="images/youtube.png" alt="youtube_icon"></a>
        </nav>
    </footer>

</body>
</html>
