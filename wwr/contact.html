<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Riverbend Rafting Co.</title>
    <meta name="description" content="Contact Riverbend Rafting Co. to book your rafting adventure, ask questions, or plan your trip. Reach out today — we're happy to help.">
    <meta name="author" content="Fernando Munoz">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<main>

    <form action="box">
        <section id="contact-info">

            <div class="company-details">
                <h1>Riverbend Rafting Co.</h1>
                <ul class="contact-list">
                    <li>301 Camino de la Merced<br>Taos, NM 87571</li>
                    <li><a href="tel:+15755550198">(575) 555-0142</a></li>
                    <li><a href="tel:+15755550198">(575) 555-0198</a></li>
                    <li><a href="mailto:contact_us@riverbend-rafting.com">contact_us@riverbend-rafting.com</a></li>
                </ul>
            </div>

            <div class="map-and-form">

                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps?q=36.4072134,-105.5733788&output=embed"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        title="Riverbend Rafting Co. location map">
                    </iframe>
                </div>


        <!-- ADVENTURES section — required content -->
        <section id="adventures">
            <h2>Adventure Awaits You!</h2>
            <div class="adventures-grid">

                <figure>
                    <img src="images/1Class_IV_Rapids.jpg" alt="Challenge the Taos Box (Class IV Rapids)">
                    <figcaption>Challenge the Taos Box (Class IV Rapids)</figcaption>
                </figure>

                <figure>
                    <img src="images/2Class_II-III_Rapids.jpg" alt="(Class II-III Rapids)">
                    <figcaption>Paddle the Racecourse (Class II-III Rapids)</figcaption>
                </figure>

                <figure>
                    <img src="images/3solo_kayak_rapids.jpg" alt="Solo Kayaking">
                    <figcaption>Try Solo Kayaking</figcaption>
                </figure>

                <figure>
                    <img src="images/4rio_grande_climbers_wide.jpg" alt="Rock Climbing">
                    <figcaption>Combine Rafting with Rock Climbing (Rock & Raft)</figcaption>
                </figure>

                <figure>
                    <img src="images/5rio_grande_golden_hour.jpg" alt="Take a Scenic Float and Swim">
                    <figcaption>Take a Scenic Float and Swim</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <!-- FOOTER: Flex — copyright left, social icons right -->
    <footer>
        <p>©️2026 | Riverbend Rafting Co. | Fernando Munoz</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.png" alt="facebook_icon"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.png" alt="instagram_icon"></a>
            <a href="https://www.youtube.com/"><img src="images/youtube.png" alt="youtube_icon"></a>
        </nav>
    </footer>

</body>
</html>
